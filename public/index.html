<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"
  integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1"
  crossorigin="anonymous"></script>
<style>
:root{
  --ink:#12202F; --slate:#1E3246; --slate-2:#2A4258; --mist:#EDF1F5; --paper:#FFFFFF;
  --teal:#12A594; --teal-dark:#0C7F72; --amber:#F0A43A; --text:#1B2733; --muted:#6B7C8C; --line:#DCE3EA;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--mist);color:var(--text);font-size:15px}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---------- join screen ---------- */
#join{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;padding:24px;z-index:10}
.join-card{width:min(420px,100%);color:#fff}
.join-card h1{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.join-card p{color:#9FB2C4;margin:12px 0 28px;line-height:1.5}
.join-card input{width:100%;padding:16px 18px;border-radius:12px;border:2px solid var(--slate-2);background:var(--slate);color:#fff}
.join-card input::placeholder{color:#7F94A8}
.join-card input:focus{border-color:var(--teal);outline:none}
.join-card button{margin-top:12px;width:100%;padding:16px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
.join-card button:hover{background:var(--teal-dark)}
#joinErr{color:#FFB4A8;min-height:20px;margin-top:10px;font-size:14px}

/* ---------- app layout ---------- */
#app{display:grid;grid-template-columns:290px 1fr;height:100%}
aside{background:var(--ink);color:#fff;display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 22px 14px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand small{display:block;font-weight:500;color:#8FA3B6;font-size:13px;letter-spacing:0;margin-top:4px}
.list{flex:1;overflow-y:auto;padding:8px 10px}
.list h2{font-size:13px;font-weight:700;color:#8FA3B6;padding:14px 12px 6px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:#fff;cursor:pointer;text-align:left}
.item:hover{background:var(--slate)}
.item.active{background:var(--slate-2)}
.item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.badge{background:var(--amber);color:var(--ink);font-size:12px;font-weight:800;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.me-bar{padding:14px 20px;border-top:1px solid var(--slate);display:flex;align-items:center;gap:12px;color:#C5D2DE;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}

/* ---------- chat pane ---------- */
main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px}
#menuBtn{display:none;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
header h3{font-size:17px;font-weight:800}
header span{color:var(--muted);font-size:13px}
#banner{background:var(--amber);color:var(--ink);font-weight:700;font-size:14px;padding:8px 22px;display:none}
#msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;max-width:min(560px,80%)}
.row.self{align-self:flex-end}
.bubble{padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--paper);box-shadow:0 1px 0 var(--line);line-height:1.45;word-break:break-word}
.row.self .bubble{background:var(--teal);color:#fff;border-radius:16px 16px 4px 16px;box-shadow:none}
.row.dm:not(.self) .bubble{background:#FFF3DE;box-shadow:inset 3px 0 0 var(--amber)}
.who{font-size:12px;font-weight:700;color:var(--teal-dark);margin-bottom:2px}
.time{font-size:11px;opacity:.65;margin-top:3px;text-align:right}
.sys{align-self:center;color:var(--muted);font-size:13px;padding:6px 0}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:300px;line-height:1.5}
#typing{height:24px;padding:0 24px;color:var(--muted);font-size:13px;font-style:italic}
form{display:flex;gap:10px;padding:12px 18px 18px;background:var(--mist)}
form input{flex:1;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
form input:focus{border-color:var(--teal);outline:none}
form input:disabled{background:#E3E8ED}
form button{padding:0 24px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
form button:hover{background:var(--teal-dark)}
form button:disabled{background:#9BB;cursor:not-allowed}

/* rooms, images, emoji, receipts */
.list h2{display:flex;align-items:center;justify-content:space-between}
.add{border:1px solid var(--slate-2);background:none;color:#C5D2DE;border-radius:8px;width:26px;height:26px;cursor:pointer;font-weight:800}
.add:hover{background:var(--slate)}
.avatar.room{border-radius:10px;background:var(--slate-2)}
.bubble img{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:2px 0 4px}
.receipt{font-size:11px;font-weight:700;margin-left:6px}
.tools{position:relative;display:flex;gap:6px}
form .tool{padding:0;width:46px;border:1px solid var(--line);background:var(--paper);border-radius:14px;font-size:20px;cursor:pointer;color:var(--text)}
form .tool:hover{border-color:var(--teal)}
form .tool:disabled{opacity:.5;cursor:not-allowed}
#emoji{position:absolute;bottom:56px;left:0;width:360px;max-width:calc(100vw-32px);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;display:none;grid-template-columns:repeat(7,1fr);gap:4px;box-shadow:0 8px 24px rgba(18,32,47,.18)}
#emoji.show{display:grid}
#emoji button{border:0;background:none;font-size:22px;padding:6px;border-radius:8px;cursor:pointer}
#emoji button:hover{background:var(--mist)}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  #menuBtn{display:block}
  .row{max-width:90%}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>

<div id="join">
  <div class="join-card">
    <h1>Class Chat</h1>
    <p>Talk with everyone in the room, or message one person privately.</p>
    <input id="nameInput" maxlength="20" placeholder="Pick a display name" autocomplete="off" aria-label="Display name">
    <button id="joinBtn">Join chat</button>
    <div id="joinErr" role="alert"></div>
  </div>
</div>

<div id="app">
  <aside id="side">
    <div class="brand">Class Chat<small id="count">Connecting…</small></div>
    <div class="list">
      <h2>Rooms <button class="add" id="addRoom" aria-label="Create room">+</button></h2>
      <div id="roomList"></div>
      <h2>People online</h2>
      <div id="userList"></div>
    </div>
    <div class="me-bar"><span class="dot"></span><span id="meName"></span></div>
  </aside>

  <main>
    <header>
      <button id="menuBtn" aria-label="Open people list">People</button>
      <div><h3 id="title">General</h3><span id="subtitle">Room</span></div>
    </header>
    <div id="banner"></div>
    <div id="msgs" aria-live="polite"></div>
    <div id="typing"></div>
    <form id="form">
      <div class="tools">
        <button type="button" class="tool" id="emojiBtn" aria-label="Insert emoji">😊</button>
        <button type="button" class="tool" id="imgBtn" aria-label="Send image">🖼️</button>
        <input type="file" id="imgInput" accept="image/*" hidden>
        <div id="emoji" role="listbox" aria-label="Emoji"></div>
      </div>
      <input id="msgInput" maxlength="500" placeholder="Write a message" autocomplete="off" aria-label="Message">
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </main>
</div>

<script>
// connects to the same server that served this page
const socket = io({ transports: ["websocket"] });

const $ = id => document.getElementById(id);
const rk = r => "r:" + r, uk = n => "u:" + n;      // conversation keys: room / user
let myName = "", current = rk("General");
let users = [], rooms = [], pendingRoom = null;
const convos = {}, unread = {}, typingNow = {}, typingTimers = {};
let iAmTyping = false, typingStop;

/* ---------- helpers ---------- */
const colors = ["#12A594","#E2574C","#5B7DB1","#B5651D","#8E5BA8","#3C8D40","#C2185B","#00838F"];
const colorFor = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return colors[h % colors.length]; };
const fmt = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const isRoom = k => k.startsWith("r:"), label = k => k.slice(2);
function avatar(text, room) {
  const a = document.createElement("div");
  a.className = "avatar" + (room ? " room" : "");
  if (!room) a.style.background = colorFor(text);
  a.textContent = room ? "#" : text.slice(0, 1).toUpperCase();
  return a;
}
const mark = (m) => ({ ...m, self: m.user === myName });

/* ---------- join ---------- */
function join() { socket.emit("setUsername", $("nameInput").value); }
$("joinBtn").onclick = join;
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") join(); });
$("nameInput").focus();
socket.on("usernameError", msg => { $("joinErr").textContent = msg; });
socket.on("joined", ({ name, rooms: r }) => {
  myName = name; rooms = r;
  $("meName").textContent = name;
  $("join").style.display = "none";
  open(rk("General"));
});

/* ---------- original event from your backend ---------- */
/*socket.on("announce", text => { const b = $("banner"); b.textContent = text; b.style.display = "block"; });*/

/* ---------- server events ---------- */
socket.on("userList", list => {
  users = list.map(u => u.name);
  $("count").textContent = users.length + (users.length === 1 ? " person online" : " people online");
  renderSidebar(); updateHeader();
});
socket.on("roomList", list => {
  rooms = list; renderSidebar();
  if (pendingRoom && rooms.includes(pendingRoom)) { open(rk(pendingRoom)); pendingRoom = null; }
});
socket.on("systemMsg", text => {
  (convos[rk("General")] = convos[rk("General")] || []).push({ sys: true, text });
  if (current === rk("General")) render();
});
socket.on("roomHistory", ({ room, messages }) => {
  convos[rk(room)] = messages.map(mark);
  if (current === rk(room)) render();
});
socket.on("dmHistory", ({ with: other, messages }) => {
  convos[uk(other)] = messages.map(m => ({ ...mark(m), dm: true, read: !!m.read }));
  if (current === uk(other)) render();
});
socket.on("roomMsg", m => {
  const key = rk(m.room);
  (convos[key] = convos[key] || []).push(mark(m));
  if (current === key) render();
  else if (m.user !== myName) { unread[key] = (unread[key] || 0) + 1; renderSidebar(); }
});
socket.on("dmMsg", m => {
  const self = m.user === myName, other = self ? m.to : m.user, key = uk(other);
  (convos[key] = convos[key] || []).push({ ...m, self, dm: true, read: false });
  if (current === key) {
    render();
    if (!self && document.visibilityState === "visible") socket.emit("markRead", { with: other });
  } else if (!self) { unread[key] = (unread[key] || 0) + 1; renderSidebar(); }
});
socket.on("messagesRead", ({ by }) => {
  (convos[uk(by)] || []).forEach(m => { if (m.self) m.read = true; });
  if (current === uk(by)) render();
});
socket.on("typing", t => {
  const key = t.private ? uk(t.user) : rk(t.room);
  clearTimeout(typingTimers[key]);
  if (t.isTyping) { typingTimers[key] = setTimeout(() => showTyping(key, null), 4000); showTyping(key, t.user); }
  else showTyping(key, null);
});
function showTyping(key, user) {
  typingNow[key] = user;
  $("typing").textContent = typingNow[current] ? typingNow[current] + " is typing…" : "";
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !isRoom(current)) socket.emit("markRead", { with: label(current) });
});

/* ---------- sending ---------- */
function send(image) {
  const text = $("msgInput").value.trim();
  if (!text && !image) return;
  if (isRoom(current)) socket.emit("roomMsg", { room: label(current), text, image });
  else socket.emit("dmMsg", { to: label(current), text, image });
  socket.emit("typing", { ...target(), isTyping: false });
  iAmTyping = false; $("msgInput").value = "";
}
const target = () => isRoom(current) ? { room: label(current) } : { to: label(current) };
$("form").addEventListener("submit", e => { e.preventDefault(); send(null); });
$("msgInput").addEventListener("input", () => {
  const t = target();
  if (!iAmTyping) { iAmTyping = true; socket.emit("typing", { ...t, isTyping: true }); }
  clearTimeout(typingStop);
  typingStop = setTimeout(() => { iAmTyping = false; socket.emit("typing", { ...t, isTyping: false }); }, 1500);
});

/* ---------- images (resized in the browser before sending) ---------- */
$("imgBtn").onclick = () => $("imgInput").click();
$("imgInput").onchange = e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f || !f.type.startsWith("image/")) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      send(c.toDataURL("image/jpeg", 0.7));
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
};

/* ---------- emoji picker ---------- */
"😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😢 😭 😡 👍 👎 👏 🙏 💪 🎉 🔥 ✨ 💯 ❤️ 💙 🎓 📚 💻 ✅ ❌ 👀 🤝 😴 🥳 😅 🙌 🤯 😇 🥲 🤗 😬 🫡 🚀 ☕".split(" ").forEach(em => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = em;
  b.onclick = () => { const i = $("msgInput"); i.value += em; i.focus(); };
  $("emoji").append(b);
});
$("emojiBtn").onclick = e => { e.stopPropagation(); $("emoji").classList.toggle("show"); };
document.addEventListener("click", e => { if (!$("emoji").contains(e.target)) $("emoji").classList.remove("show"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("emoji").classList.remove("show"); });

/* ---------- rooms ---------- */
$("addRoom").onclick = () => {
  const name = (prompt("Name for the new room") || "").trim();
  if (!name) return;
  const existing = rooms.find(r => r.toLowerCase() === name.toLowerCase());
  if (existing) return open(rk(existing));
  pendingRoom = name.slice(0, 20); socket.emit("createRoom", name);
};

/* ---------- rendering ---------- */
function open(key) {
  current = key; unread[key] = 0;
  $("side").classList.remove("open");
  $("emoji").classList.remove("show");
  if (isRoom(key)) socket.emit("loadRoom", label(key));
  else { socket.emit("loadDm", label(key)); socket.emit("markRead", { with: label(key) }); }
  showTyping(key, typingNow[key]);
  render(); $("msgInput").focus();
}
function item(key, name, room) {
  const b = document.createElement("button");
  b.className = "item" + (current === key ? " active" : "");
  b.append(avatar(name, room));
  const n = document.createElement("span"); n.className = "name"; n.textContent = name; b.append(n);
  if (unread[key]) { const u = document.createElement("span"); u.className = "badge"; u.textContent = unread[key]; b.append(u); }
  b.onclick = () => open(key);
  return b;
}
function renderSidebar() {
  $("roomList").replaceChildren(...rooms.map(r => item(rk(r), r, true)));
  const others = users.filter(u => u !== myName);
  $("userList").replaceChildren(...others.map(u => item(uk(u), u, false)));
  if (!others.length) {
    const p = document.createElement("p");
    p.style.cssText = "color:#8FA3B6;font-size:13px;padding:6px 12px";
    p.textContent = "No one else is here yet. Open this page in another tab to try it.";
    $("userList").append(p);
  }
}
function updateHeader() {
  const room = isRoom(current), name = label(current);
  const online = room || users.includes(name);
  $("title").textContent = room ? "# " + name : name;
  $("subtitle").textContent = room ? "Room" : online ? "Private conversation" : "This person went offline";
  ["msgInput", "sendBtn", "imgBtn", "emojiBtn"].forEach(id => $(id).disabled = !online);
  $("msgInput").placeholder = !online ? "They have left the chat" : room ? "Message #" + name : "Write a private message";
}
function render() {
  updateHeader(); renderSidebar();
  const box = $("msgs"); box.replaceChildren();
  const list = convos[current] || [];
  if (!list.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = isRoom(current) ? "No messages yet. Say hello to the room." : "No messages yet. Only you and " + label(current) + " can see this conversation.";
    box.append(e); return;
  }
  for (const m of list) {
    if (m.sys) { const s = document.createElement("div"); s.className = "sys"; s.textContent = m.text; box.append(s); continue; }
    const row = document.createElement("div"); row.className = "row" + (m.self ? " self" : "") + (m.dm ? " dm" : "");
    const bub = document.createElement("div"); bub.className = "bubble";
    if (!m.self && !m.dm) { const w = document.createElement("div"); w.className = "who"; w.textContent = m.user; bub.append(w); }
    if (m.image) { const im = document.createElement("img"); im.src = m.image; im.alt = "Shared image"; im.onload = () => { box.scrollTop = box.scrollHeight; }; bub.append(im); }
    if (m.text) { const t = document.createElement("div"); t.textContent = m.text; bub.append(t); }
    const tm = document.createElement("div"); tm.className = "time"; tm.textContent = fmt(m.time);
    if (m.self && m.dm) {
      const r = document.createElement("span"); r.className = "receipt";
      r.textContent = m.read ? "✓✓ Seen" : "✓ Sent"; tm.append(r);
    }
    bub.append(tm); row.append(bub); box.append(row);
  }
  box.scrollTop = box.scrollHeight;
}
$("menuBtn").onclick = () => $("side").classList.toggle("open");
</script>
</body>
</html>
